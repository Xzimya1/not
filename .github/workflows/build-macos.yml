name: Build SleepGuard macOS Intel DMG

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Intel x86_64 DMG
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Build SleepGuard (Intel x86_64)
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build

          xcodebuild \
            -project SleepGuard.xcodeproj \
            -scheme SleepGuard \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -sdk macosx \
            -arch x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

          APP="build/DerivedData/Build/Products/Release/SleepGuard.app"
          test -d "$APP"
          cp -R "$APP" build/SleepGuard.app

          file build/SleepGuard.app/Contents/MacOS/SleepGuard
          lipo -info build/SleepGuard.app/Contents/MacOS/SleepGuard

      - name: Create DMG
        run: |
          set -euo pipefail
          rm -f build/SleepGuard-Intel-x86_64.dmg
          rm -rf build/dmg-stage
          mkdir -p build/dmg-stage
          cp -R build/SleepGuard.app build/dmg-stage/
          ln -s /Applications build/dmg-stage/Applications

          hdiutil create \
            -volname "SleepGuard" \
            -srcfolder build/dmg-stage \
            -ov \
            -format UDZO \
            build/SleepGuard-Intel-x86_64.dmg

          test -f build/SleepGuard-Intel-x86_64.dmg
          hdiutil imageinfo build/SleepGuard-Intel-x86_64.dmg | head -40

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: SleepGuard-macOS-Intel-x86_64
          path: build/SleepGuard-Intel-x86_64.dmg
          if-no-files-found: error
          retention-days: 14
